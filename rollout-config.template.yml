# rollout-config.template.yml
#
# Template for the project-level `rollout-config.yml`. Copy this file to
# `.specify/extensions/rollout/rollout-config.yml` (or let `specify extension
# add` do so) and edit the non-secret pointer values below.
#
# Modular per-provider shape: `provider` selects the *active* provider, and
# each provider ever configured gets its own top-level block (e.g.
# `launchdarkly:` below). Adding a second provider adds a sibling top-level
# block here — it never touches this block or the `provider` field's type
# (see docs/providers.md "Adding a new provider"). Run `/speckit.rollout.config`
# to populate a provider's block via the guided wizard, or
# `/speckit.rollout.provider <provider_name>` to switch the active provider.
#
# This file does NOT hold an MCP server registration (no `mcp.command`,
# `mcp.args`, `mcp.version`, `mcp.repository`, or `mcp.token_env_var` field
# exists anywhere in this schema). Register your provider's official MCP
# server yourself, directly in your Spec Kit client's own native MCP
# settings (e.g. `.vscode/mcp.json`) — `/speckit.rollout.config` only
# discovers and uses whichever server you've already registered there; it
# never writes to that file. The *selection* of which already-registered
# MCP server to use (its name/key only, never its launch command or a
# credential) is saved under the literal, flat key `mcp_server` to
# `.specify/extensions/rollout/local-config.yml`, not here.
#
# Example local-config.yml content:
#   mcp_server: launchdarkly/mcp-server
#
# SECURITY WARNING: this file, and the file you copy it to, MUST NEVER
# contain a real credential/token value. No step of this extension's
# doctrine ever requests, reads, or stores one — your MCP client and MCP
# server process own credential handling entirely.
#
# For a personal override (e.g. a sandbox project key) without touching
# this shared file, create `.specify/extensions/rollout/local-config.yml`
# with just the fields you want to override. Spec Kit does NOT automatically
# gitignore that file for you — add your own `.gitignore` rule for
# `.specify/extensions/rollout/local-config.yml` in your project.

provider: launchdarkly

# Non-secret pointers only (see docs/foundation/vision.md section 8).
launchdarkly:
  project_key: ""
  environments: []
  # "hosted" | "local" | "" (unset). Recorded for reporting/traceability
  # only — /speckit.rollout.config re-verifies this fresh on every run and
  # never trusts this stored value as a cache.
  server_type: ""

# Team-level toggle for the extension's hooks (see vision.md section 5.3).
hooks:
  enabled: true
